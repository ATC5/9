<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الشرف | المنصة العراقية للطيران</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="img/logo.png">
</head>
<body>

    <header>
        <div class="header-container">
            <div class="logo">
                <a href="index.html">
                    <img src="img/1.PNG" alt="شعار المنصة العراقية للطيران" class="logo-img">
                </a>
            </div>
            <nav class="nav-bar">
                <ul>
                    <li><a href="index.html">الرئيسية</a></li>
                    <li><a href="training.html">الدورات</a></li>
                    <li><a href="winners.html" class="active">لوحة الشرف</a></li>
                    <li><a href="about.html">من نحن</a></li>
                    <li><a href="contact.html">اتصل بنا</a></li>
                    <li><a href="cert.html" class="btn-verify-nav"><i class="fas fa-certificate"></i> التحقق من الشهادات</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="hero">
        <h1>لوحة الشرف والتميز</h1>
         <h1>Iraqi Flight Platform</h1>
        <p>قائمة بالمتميزين والفائزين في دورات واختبارات المنصة</p>
    </section>

    <div class="container">
        <div style="text-align: center; margin-bottom: 30px;">
            <input type="text" id="searchBox" placeholder="ابحث عن اسم الفائز..." onkeyup="searchCertificate()" 
                   style="padding: 14px; width: 100%; max-width: 500px; border-radius: 30px; border: 2px solid #e1e8ed; text-align: center; outline: none;">
        </div>

        <div id="certificatesList" class="grid-container"></div>
    </div>

    <footer>
        <p>جميع الحقوق محفوظة &copy; 2026 <strong>المنصة العراقية للطيران</strong></p>
    </footer>

    <!-- ربط ملف بيانات الشهادات -->
    <script src="2.js"></script>
    
    <script>
        function displayCertificates(list) {
            var certificatesDiv = document.getElementById("certificatesList");
            certificatesDiv.innerHTML = "";

            list.forEach(cert => {
                var card = document.createElement("div");
                card.className = "card";
                card.style.borderTop = "5px solid #d97706";
                
                card.innerHTML = `
                    <i class="fas fa-medal" style="color: #d97706; font-size: 36px;"></i>
                    <h3 style="margin: 12px 0;">${cert.name}</h3>
                    <a href="${cert.pdf}" target="_blank" style="color: var(--primary-color); font-weight: bold; font-size: 0.95rem;">
                        <i class="fas fa-file-pdf"></i> عرض الشهادة
                    </a>
                `;
                certificatesDiv.appendChild(card);
            });
        }

        document.addEventListener("DOMContentLoaded", function() {
            if (typeof certificates !== 'undefined') {
                displayCertificates(certificates);
            }
        });

        function searchCertificate() {
            var searchInput = document.getElementById("searchBox").value.toLowerCase();
            var filtered = certificates.filter(cert => cert.name.toLowerCase().includes(searchInput));
            displayCertificates(filtered);
        }
    </script>
</body>
</html>
